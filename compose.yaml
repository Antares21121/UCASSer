name: ${COMPOSE_PROJECT_NAME:-campus-forum-dev}
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: mariadb:11.4.13
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Run setup first}
      MARIADB_USER: ${DB_USER:?Run setup first}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run setup first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run setup first}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: ${FORUM_ENV_FILE:-.env}
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ""
    volumes:
      - .:/var/www/forum
      - assets:/var/www/forum/public/assets
      - storage:/var/www/forum/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "scripts/db.php"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
    restart: unless-stopped
  web:
    image: nginx:1.30.1-alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/forum/public:ro
      - assets:/var/www/forum/public/assets:ro
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
    restart: unless-stopped
volumes:
  database:
  assets:
  storage:
