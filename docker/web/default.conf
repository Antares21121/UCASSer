log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name _;
    root /var/www/forum/public;
    index index.php;
    server_tokens off;
    client_max_body_size 10m;
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ (^|/)\. { return 404; }
    location ~* ^/(?:config\.php|composer\.(?:json|lock)|storage|vendor|backups|flarum|auth\.json) { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
    }
    location ~* \.(php|phar)(/|$) { return 404; }
    location /assets/ { try_files $uri =404; expires 1h; }
}
