name: Infrastructure and campus acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22.18.0", cache: npm}
      - name: Locked frontend build and browser runtime
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Static checks and launcher behavior
        run: |
          python -m pip install -r tests/requirements.txt
          python scripts/check.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build reproducible development image and dependencies
        run: python scripts/forum.py setup
      - name: Validate Compose, PHP and Nginx syntax
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps app sh -c 'find config scripts public extensions tests -name "*.php" -exec php -l {} \;'
          docker compose run --rm --no-deps app composer validate --strict --no-check-all
          docker compose run --rm --no-deps app composer check-platform-reqs --no-dev
          docker compose up -d --wait
          docker compose exec -T web nginx -t
      - name: Real install, restart, backup and isolated restore
        run: python tests/smoke.py --backend docker
      - name: Real campus acceptance phases 1 through 11
        run: python tests/campus_smoke.py --backend docker --phase 11
      - name: Browser workflows and mobile layout
        run: npm run test:browser
      - name: Security audit (no ignored advisories)
        run: python scripts/audit.py --backend docker
      - name: Redacted failure diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import subprocess, re
          from pathlib import Path
          from scripts.forum import read_env
          values = read_env(Path('.env')) if Path('.env').exists() else {}
          secrets = [v for k, v in values.items() if 'PASSWORD' in k and v]
          password = Path('.runtime/admin-initial-password.txt')
          if password.exists():
              secrets.append(password.read_text().strip())
          commands = [
              ['docker', 'compose', 'logs', '--no-color', '--tail', '60', 'app', 'web'],
              ['docker', 'compose', 'exec', '-T', 'app', 'sh', '-c', 'ls -ld config.php storage storage/logs public/assets; tail -n 60 storage/logs/*.log'],
          ]
          for command in commands:
              result = subprocess.run(command, capture_output=True, text=True)
              output = result.stdout + result.stderr
              for secret in secrets:
                  output = output.replace(secret, '[REDACTED]')
              output = re.sub(r'/(confirm|reset|gdpr/erasure/confirm)/[^\s?"<>]+', r'/\1/[REDACTED]', output)
              output = re.sub(r'([A-Z]+ /[^\s?]*)\?\S+', r'\1?[REDACTED]', output)
              print(output)
          PY
      - name: Preserve diagnostics without secrets or backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verification
          path: |
            .runtime/verification.json
            .runtime/campus-verification.json
          # Reports contain outcomes only, never fixtures, mail, tokens or browser traces.
          if-no-files-found: ignore
      - name: Stop services without deleting data
        if: always()
        run: docker compose stop
