name: Infrastructure and campus acceptance
on:
  push:
    branches: ["2.x"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: campus-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: {node-version: "22.18.0", cache: npm}
      - name: Locked frontend build and browser runtime
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Static checks and launcher behavior
        run: |
          python -m pip install -r tests/requirements.txt
          python scripts/check.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build reproducible development image and dependencies
        run: python scripts/forum.py setup
      - name: Validate Compose, PHP and Nginx syntax
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps app sh -c 'find config scripts public extensions tests -name "*.php" -exec php -l {} \;'
          docker compose run --rm --no-deps app php tests/aggregation_parser.php
          docker compose run --rm --no-deps app php tests/aggregation_vsb_parser.php
          docker compose run --rm --no-deps app php tests/aggregation_employment_parser.php
          docker compose run --rm --no-deps app php tests/course_csv_reader.php
          docker compose run --rm --no-deps app php tests/collector_client_config.php
          docker compose run --rm --no-deps app composer validate --strict --no-check-all
          docker compose run --rm --no-deps app composer check-platform-reqs --no-dev
          docker compose up -d --wait
          docker compose exec -T web nginx -t
      - name: Real install, restart, backup and isolated restore
        run: python tests/smoke.py --backend docker
      - name: Enable resource directory extension and exercise its API
        run: |
          python scripts/enable_resources.py --backend docker --admin-user phase0_admin --password-file .runtime/admin-initial-password.txt
          python tests/resource_smoke.py --url http://127.0.0.1:8080 --admin-user phase0_admin --password-file .runtime/admin-initial-password.txt
      - name: Real campus acceptance phases 1 through 11
        run: python tests/campus_smoke.py --backend docker --phase 11
      - name: Aggregation submission and review acceptance
        run: python tests/aggregation_smoke.py --backend docker
      - name: Authorized course directory import acceptance
        run: python tests/course_import_smoke.py --backend docker
      - name: Separate operations backend and private chat image acceptance
        run: |
          python tests/operator_smoke.py --backend docker
          docker compose exec -T -u www-data app php flarum extension:enable flarum-messages
          python tests/chat_image_smoke.py --backend docker
      - name: Board redesign, operator catalog and mention acceptance
        run: |
          docker compose exec -T -u www-data app php -r 'exit((extension_loaded("gd") && (gd_info()["WebP Support"] ?? false)) ? 0 : 1);'
          docker compose exec -T -u www-data app php flarum campus:boards:migrate
          docker compose exec -T -u www-data app php tests/board_migration.php
          docker compose exec -T -u www-data app php tests/catalog_recovery.php
          docker compose exec -T -u www-data app php tests/operator_provision.php
          docker compose exec -T -u www-data app php tests/public_candidate_recovery.php
          docker compose exec -T -u www-data app php tests/suffix_mention_parser.php
          python tests/redesign_smoke.py --backend docker
      - name: Isolated deployment rehearsal preserves the live instance
        run: python tests/stage_instance_smoke.py
      - name: Browser workflows and mobile layout
        run: npm run test:browser
      - name: Security audit (no ignored advisories)
        run: python scripts/audit.py --backend docker
      - name: Redacted failure diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import subprocess, re
          from pathlib import Path
          from scripts.forum import read_env
          env_files = [Path('.env'), *Path('.runtime').glob('restore-verification-*/.env')]
          secrets = [v for path in env_files if path.exists() for k, v in read_env(path).items() if 'PASSWORD' in k and v]
          password = Path('.runtime/admin-initial-password.txt')
          if password.exists():
              secrets.append(password.read_text().strip())
          commands = [
              ['docker', 'compose', 'logs', '--no-color', '--tail', '60', 'app', 'web'],
              ['docker', 'compose', 'exec', '-T', 'app', 'sh', '-c', 'ls -ld config.php storage storage/logs public/assets; tail -n 60 storage/logs/*.log'],
          ]
          for command in commands:
              result = subprocess.run(command, capture_output=True, text=True)
              output = result.stdout + result.stderr
              for secret in secrets:
                  output = output.replace(secret, '[REDACTED]')
              output = re.sub(r'/(confirm|reset|gdpr/erasure/confirm)/[^\s?"<>]+', r'/\1/[REDACTED]', output)
              output = re.sub(r'([A-Z]+ /[^\s?]*)\?\S+', r'\1?[REDACTED]', output)
              print(output)
          for path in [Path('.runtime/last-error.log'), *Path('.runtime').glob('restore-verification-*/.runtime/last-error.log')]:
              if not path.exists():
                  continue
              output = path.read_text(errors='replace')
              for secret in secrets:
                  output = output.replace(secret, '[REDACTED]')
              output = re.sub(r'/(confirm|reset|gdpr/erasure/confirm)/[^\s?"<>]+', r'/\1/[REDACTED]', output)
              print('Redacted launcher diagnostic: ' + output[-12000:])
          PY
      - name: Preserve diagnostics without secrets or backups
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-verification
          path: |
            .runtime/verification.json
            .runtime/campus-verification.json
          # Reports contain outcomes only, never fixtures, mail, tokens or browser traces.
          if-no-files-found: ignore
      - name: Stop services without deleting data
        if: always()
        run: docker compose stop
