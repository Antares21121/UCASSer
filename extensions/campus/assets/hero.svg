<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="书桌上摊开的书、笔记与咖啡杯，背后是淡淡的校园建筑轮廓">
  <rect width="640" height="400" fill="#F7F4EE"/>
  <!-- 背景：低对比的校园建筑轮廓 -->
  <g fill="#DFEAF2">
    <path d="M0 210h84v-58h44v58h26v-34h56v34h30v-78h52v78h34v-46h44v46h28v-26h40v26h38v-62h48v62h22v22H0z" opacity="0.75"/>
    <rect x="96" y="128" width="10" height="24" opacity="0.55"/>
    <rect x="228" y="106" width="10" height="26" opacity="0.55"/>
    <rect x="420" y="118" width="10" height="24" opacity="0.55"/>
  </g>
  <rect y="232" width="640" height="168" fill="#F2ECE0" opacity="0.6"/>
  <!-- 桌面 -->
  <rect x="0" y="316" width="640" height="10" fill="#E6DFD1"/>
  <rect x="0" y="326" width="640" height="6" fill="#EFE6D6"/>
  <!-- 摊开的书：左右两页 + 书脊 + 红色书签 -->
  <g>
    <path d="M148 262c52-16 92-10 128 6v58c-36-16-76-22-128-6z" fill="#FFFFFF" stroke="#E6DFD1" stroke-width="2" stroke-linejoin="round"/>
    <path d="M276 268c36-16 76-22 128-6v58c-52-16-92-10-128 6z" fill="#FFFDF8" stroke="#E6DFD1" stroke-width="2" stroke-linejoin="round"/>
    <path d="M276 266v62" stroke="#E6DFD1" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#DFEAF2" stroke-width="5" stroke-linecap="round">
      <path d="M170 276h84M170 290h84M170 304h62"/>
    </g>
    <g stroke="#EFE6D6" stroke-width="5" stroke-linecap="round">
      <path d="M300 282h84M300 296h84M300 310h58"/>
    </g>
    <path d="M386 262l14-46 14 4-12 44z" fill="#C22A49"/>
    <path d="M148 262c52-16 92-10 128 6" fill="none" stroke="#C22A49" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- 咖啡杯 -->
  <g>
    <path d="M468 268h56v34c0 12-10 20-28 20s-28-8-28-20z" fill="#FFFFFF" stroke="#E6DFD1" stroke-width="2"/>
    <path d="M524 276c14 0 22 8 22 18s-8 18-22 18" fill="none" stroke="#C8DBE8" stroke-width="5" stroke-linecap="round"/>
    <rect x="462" y="318" width="70" height="7" rx="3.5" fill="#E6DFD1"/>
    <g stroke="#C22A49" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M484 254c4-7 4-12 0-19M500 252c4-7 4-12 0-19"/>
    </g>
  </g>
  <!-- 便签与铅笔 -->
  <g>
    <rect x="92" y="204" width="66" height="66" rx="6" fill="#DFEAF2" transform="rotate(-7 92 204)"/>
    <rect x="104" y="214" width="62" height="62" rx="6" fill="#FFFFFF" stroke="#E6DFD1" stroke-width="2" transform="rotate(6 104 214)"/>
    <g stroke="#E6DFD1" stroke-width="4" stroke-linecap="round" transform="rotate(6 104 214)">
      <path d="M116 234h38M116 248h30M116 262h34"/>
    </g>
    <circle cx="132" cy="216" r="5" fill="#A71937"/>
    <g transform="rotate(-24 560 300)">
      <rect x="540" y="292" width="74" height="10" rx="3" fill="#C22A49"/>
      <path d="M614 292l16 5-16 5z" fill="#1C3042"/>
      <rect x="536" y="292" width="8" height="10" rx="3" fill="#DFEAF2"/>
    </g>
  </g>
  <!-- 细红线点缀 -->
  <path d="M60 348h520" stroke="#C22A49" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <circle cx="596" cy="72" r="6" fill="#C22A49" opacity="0.85"/>
</svg>
